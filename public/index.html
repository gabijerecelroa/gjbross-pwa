<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CONEXION</title>
  <meta name="theme-color" content="#0b0b0f" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <section id="pinCard" class="card pin-card hidden">
      <h2>Ingresar PIN</h2>
      <input id="pinInput" placeholder="PIN" type="password" inputmode="numeric" />
      <button id="savePinBtn">Entrar</button>
    </section>

    <section class="card hero">
      <img src="/cnx-logo.png" class="hero-logo" alt="CNX" />
      <div class="hero-text">
        <div class="eyebrow">LISTA ESPECIAL</div>
        <img src="/conexion-wordmark.jpg" class="wordmark" alt="CONEXION" />
        <div class="subtitle">Invitados del boliche</div>
      </div>
    </section>

    <section class="tabs">
      <button id="btnGuestsTab" class="tab active">Invitados</button>
      <button id="btnVipTab" class="tab">Invitados VIP</button>
      <button id="btnBlacklistTab" class="tab">Lista negra</button>
      <button id="btnHistoryTab" class="tab">Historial</button>
    </section>

    <section id="guestPanel">
      <section class="stats">
        <div class="card stat"><div id="guestCount" class="num">0</div><div>Invitados</div></div>
        <div class="card stat"><div id="peopleCount" class="num">0</div><div>Personas</div></div>
        <div class="card stat"><div id="attendedCount" class="num">0</div><div>Ingresaron</div></div>
        <div class="card stat"><div id="pendingCount" class="num">0</div><div>Pendientes</div></div>
      </section>

      <section class="card close-card">
        <div class="close-title">Cerrar lista del día</div>
        <input id="closeDateInput" type="date" />
        <button id="closeListBtn" type="button">Cerrar lista y guardar historial</button>
      </section>

      <section class="card">
        <form id="guestForm" class="guest-form">
          <input id="nameInput" placeholder="Nombre del invitado" autocomplete="off" />
          <input id="qtyInput" type="number" min="1" value="1" />
          <button type="submit">Agregar</button>
        </form>
      </section>

      <section class="card">
        <input id="searchInput" class="search" placeholder="Buscar invitado..." />
        <div id="list" class="list"></div>
      </section>
    </section>

    <section id="vipPanel" class="hidden">
      <section class="stats">
        <div class="card stat"><div id="vipGuestCount" class="num">0</div><div>VIP</div></div>
        <div class="card stat"><div id="vipPeopleCount" class="num">0</div><div>Personas</div></div>
        <div class="card stat"><div id="vipAttendedCount" class="num">0</div><div>Ingresaron</div></div>
        <div class="card stat"><div id="vipPendingCount" class="num">0</div><div>Pendientes</div></div>
      </section>

      <section class="card close-card vip-card">
        <div class="close-title">Cerrar lista VIP del día</div>
        <input id="vipCloseDateInput" type="date" />
        <button id="closeVipListBtn" type="button">Cerrar lista VIP y guardar historial</button>
      </section>

      <section class="card vip-card">
        <form id="vipForm" class="guest-form">
          <input id="vipNameInput" placeholder="Nombre del invitado VIP" autocomplete="off" />
          <input id="vipQtyInput" type="number" min="1" value="1" />
          <button type="submit">Agregar VIP</button>
        </form>
      </section>

      <section class="card vip-card">
        <input id="vipSearchInput" class="search" placeholder="Buscar VIP..." />
        <div id="vipList" class="list"></div>
      </section>
    </section>

    <section id="blacklistPanel" class="hidden">
      <section class="card">
        <form id="blackForm" class="black-form">
          <input id="blackNameInput" placeholder="Nombre para lista negra" autocomplete="off" />
          <input id="blackNoteInput" placeholder="Motivo / nota opcional" autocomplete="off" />
          <button type="submit">Agregar a lista negra</button>
        </form>
      </section>

      <section class="card danger-card">
        <input id="blackSearchInput" class="search" placeholder="Buscar en lista negra..." />
        <div id="blackList" class="list"></div>
      </section>
    </section>

    <section id="historyPanel" class="hidden">
      <section class="card">
        <input id="historySearchInput" class="search" placeholder="Buscar por fecha o nombre..." />
        <button id="clearHistoryBtn" class="clear-history-btn" type="button">Borrar historial completo</button>
        <div id="historyList" class="list"></div>
      </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
